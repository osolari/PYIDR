exclude: '^(docs/report/|data/|runs/|artifacts/|checkpoints/|logs/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - "pydantic>=2.6"
          - "typer>=0.12"
          - "structlog>=24.1"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-q, -lll, --skip, "B101"]
        files: ^src/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-figure-backlinks
        name: Each figure/table reproducer references its LaTeX label
        language: system
        entry: python scripts/hooks/check_figure_backlinks.py
        files: ^src/py_idr/(figures|tables)/.*\.py$

      - id: check-hypotheses-schema
        name: hypotheses.yaml validates against pydantic schema
        language: system
        entry: python scripts/hooks/check_hypotheses_schema.py
        files: ^configs/preregistration/hypotheses\.yaml$
