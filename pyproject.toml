[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "py_idr"
version = "0.0.1"
description = "Hierarchical nonparametric Bayesian IDR via Pitman-Yor copula mixtures (PY-IDR)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "PY-IDR contributors" }]
keywords = ["statistics", "bayesian-nonparametrics", "copula", "idr", "fdr", "pitman-yor"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpyro>=0.15",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "rich>=13.7",
    "structlog>=24.1",
    "arviz>=0.18",
    "pydantic>=2.6",
    "typer>=0.12",
    "zarr>=2.17",
    "jaxtyping>=0.2.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
metal = ["jax-metal"]
data = [
    "pyranges>=0.0.129",
    "h5py>=3.10",
    "anndata>=0.10",
    "scanpy>=1.10",
    "requests>=2.31",
]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
logging = [
    "wandb>=0.16",
    "tensorboard>=2.16",
    "aim>=3.18",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-macros-plugin>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "coverage[toml]>=7.4",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "jupytext>=1.16",
    "nbmake>=1.5",
    "pip-tools>=7.4",
    "matplotlib>=3.8",
]

[project.scripts]
py-idr = "py_idr.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/PY-IDR"
Documentation = "https://your-org.github.io/PY-IDR"
Issues = "https://github.com/your-org/PY-IDR/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/py_idr"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100
extend-exclude = [
    "docs/report",          # upstream paper sources (LaTeX + matplotlib figure generator)
    "data",
    "runs",
    "artifacts",
    "checkpoints",
    "logs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle / pyflakes
    "I",                     # isort
    "B",                     # bugbear
    "UP",                    # pyupgrade
    "SIM",                   # simplify
    "D",                     # pydocstyle
]
ignore = [
    "D203", "D213",          # docstring style choice
    "D100", "D104",          # missing module / package docstring (allow stubs)
    "D301",                  # raw docstrings — we use \\ for LaTeX which renders identically
    "UP037",                 # do not strip quotes from runtime-evaluated annotations
                              # (jaxtyping shape strings like Float[Array, "K K"] need them)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"experiments/**" = ["D"]
# Notebooks legitimately split imports across narrative cells (E402)
# and use compact one-line statements (E702).
"notebooks/**" = ["D", "E402", "E702"]
"docs/**" = ["D"]
# jaxtyping shape strings like Float[Array, "n K"] register as F821/F722 forward refs.
"src/py_idr/algebra/**" = ["F821", "F722"]
"src/py_idr/comparators/**" = ["F821", "F722"]
"src/py_idr/copulas/**" = ["F821", "F722"]
"src/py_idr/decision/**" = ["F821", "F722"]
"src/py_idr/inference/**" = ["F821", "F722"]
"src/py_idr/marginals/**" = ["F821", "F722"]
"src/py_idr/model/**" = ["F821", "F722"]
"src/py_idr/pym/**" = ["F821", "F722"]
"src/py_idr/simulation/**" = ["F821", "F722"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
extend-exclude = '''
/(
    docs/report
  | data
  | runs
  | artifacts
  | checkpoints
  | logs
  | \.venv
)/
'''

[tool.mypy]
python_version = "3.11"
warn_unused_configs = false  # we override module-by-module; many sub-tables fire empty notes
disallow_any_unimported = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
# JAX / NumPy / SciPy return Any pervasively from C-impl funcs, and propagating
# Any out of helpers triggers a noisy [no-any-return] storm without catching
# real bugs. Disable; the [arg-type] / [assignment] checks still fire.
warn_return_any = false
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["experiments.*", "tests.*", "notebooks.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "jax.*",
    "jaxlib.*",
    "numpyro.*",
    "arviz.*",
    "scanpy.*",
    "anndata.*",
    "pyranges.*",
    "zarr.*",
    "h5py.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "tcolorbox.*",
]
ignore_missing_imports = true

# jaxtyping shape strings like Float[Array, "n K"] trigger spurious "name-defined"
# under mypy's PEP-484 forward-reference resolution. Disable for the math-heavy
# subpackages where jaxtyping is dominant; the math correctness is verified by tests.
#
# Also disable arg-type + assignment + arg-type on these modules: every helper
# along the JAX/numpy boundary annotates with `Float[Array, ...]` for shape
# documentation but the runtime contract is "any 2-D array-like that
# np.asarray accepts" — JAX arrays, numpy arrays, lists of lists. The tests
# verify the runtime behaviour; the static annotations are documentation, not
# a checkable contract.
[[tool.mypy.overrides]]
module = [
    "py_idr.algebra.*",
    "py_idr.copulas.*",
    "py_idr.comparators.*",
    "py_idr.decision.*",
    "py_idr.figures.*",
    "py_idr.inference.*",
    "py_idr.marginals.*",
    "py_idr.model.*",
    "py_idr.pym.*",
    "py_idr.simulation.*",
]
disable_error_code = ["name-defined", "arg-type", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "smoke: minimal sanity checks runnable on any dev machine",
    "unit: pure unit tests for a single module",
    "property: hypothesis-driven property tests",
    "numerical: tests checking numerical bounds (rate, contraction, ...)",
    "inference: MCMC / VI correctness tests",
    "identifiability: tests gating Theorem 3.1",
    "decision: Sun-Cai / Bayes-mFDR tests",
    "integration: end-to-end small-scale tests",
    "regression: golden-file tests that gate behavioural drift",
    "gpu: requires a CUDA or Metal JAX backend",
    "slow: > 30 s",
]

[tool.coverage.run]
source = ["src/py_idr"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
